:root{
  --bg:#0d0c16; --acc:#d80142; --acc2:#ff2d6f; --txt:#f3eef9; --mut:#9b94b8; --dim:#5d5778;
  --panel:rgba(22,18,40,.88); --line:rgba(216,1,66,.55);
  --glow:0 0 14px rgba(216,1,66,.38),0 0 2px rgba(255,45,111,.7),inset 0 0 22px rgba(216,1,66,.10);
  --f-title:'Igra Sans','Arial Black',Arial,Helvetica,sans-serif;
  --f-sub:'Jura',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'Feature Mono',ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  --STR:#ff3b5c; --INT:#4dc3ff; --VIT:#3ef0a0; --BIZ:#ffc23e; --FAM:#c77dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font-family:var(--f-sub);font-weight:600;font-size:15px;min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(216,1,66,.22),transparent 60%),
    linear-gradient(rgba(216,1,66,.045) 1px,transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg,rgba(216,1,66,.045) 1px,transparent 1px) 0 0/28px 100%,
    var(--bg);
  background-attachment:fixed;}
button,input,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.brand{font-family:var(--f-title);letter-spacing:.12em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .logo{display:inline-grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--acc);border-radius:7px;color:var(--acc2);font-size:12px;box-shadow:var(--glow);letter-spacing:0}
.date{font-family:var(--f-mono);font-size:12px;color:var(--mut);text-align:right;line-height:1.3}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--glow);padding:14px;margin-bottom:14px}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--acc2);pointer-events:none;filter:drop-shadow(0 0 4px var(--acc))}
.panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.ptitle h2{font-family:var(--f-title);font-weight:400;font-size:16px;letter-spacing:.14em;margin:0;text-shadow:0 0 10px rgba(216,1,66,.8)}
.ptitle .meta{font-family:var(--f-mono);font-size:12px;color:var(--mut);white-space:nowrap}
/* player */
.player{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.rank{width:72px;height:72px;display:grid;place-items:center;position:relative}
.rank .hex{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,var(--acc2),#5a0020)}
.rank .hex2{position:absolute;inset:3px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:#140c1f}
.rank b{position:relative;font-family:var(--f-title);font-weight:400;font-size:34px;color:#fff;text-shadow:0 0 12px var(--acc),0 0 24px var(--acc)}
.rank small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;letter-spacing:.15em;background:var(--acc);color:#fff;padding:1px 5px;border-radius:3px;white-space:nowrap}
.pname{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pname .n{font-family:var(--f-title);font-size:18px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .lv{font-family:var(--f-mono);font-size:13px;color:var(--acc2);white-space:nowrap}
.pname .lv b{font-size:22px;color:#fff;text-shadow:0 0 10px var(--acc)}
.ptag{font-size:12px;color:var(--mut);letter-spacing:.08em;margin:1px 0 7px;display:flex;justify-content:space-between;gap:6px}
.ptag .streak{color:#ffb36b;font-family:var(--f-mono)}
.bar{height:10px;border-radius:6px;background:#1f1a33;border:1px solid rgba(216,1,66,.35);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a0030,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc);border-radius:6px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.xpnum{font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between}
.minis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px}
.mini{text-align:center;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:5px 0 4px;background:rgba(0,0,0,.25)}
.mini span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}
.mini b{font-family:var(--f-mono);font-size:16px;font-weight:400}
/* quests */
.quest{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(10,8,20,.55);margin-bottom:8px;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,box-shadow .2s;width:100%;text-align:left}
.quest:active{transform:scale(.99)}
.chk{flex:0 0 24px;height:24px;border:2px solid var(--acc);border-radius:6px;display:grid;place-items:center;box-shadow:0 0 8px rgba(216,1,66,.45)}
.quest.done{border-color:rgba(216,1,66,.6);background:linear-gradient(90deg,rgba(216,1,66,.20),rgba(216,1,66,.05));box-shadow:inset 0 0 14px rgba(216,1,66,.18)}
.quest.done .chk{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.quest.done .chk::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.qbody{flex:1;min-width:0}
.qname{font-size:15px;line-height:1.2}
.quest.done .qname{color:#e9d6e0;text-decoration:line-through;text-decoration-color:rgba(255,45,111,.7)}
.qsub{display:flex;gap:8px;align-items:center;margin-top:4px;font-family:var(--f-mono);font-size:11px;color:var(--mut)}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.qxp{font-family:var(--f-mono);font-size:13px;color:var(--acc2);white-space:nowrap;text-align:right}
.qxp small{display:block;color:var(--dim);font-size:10px}
.fire{color:#ffb36b}
.clear{text-align:center;font-family:var(--f-title);letter-spacing:.14em;font-size:14px;padding:10px;border:1px dashed var(--acc);border-radius:10px;color:#fff;text-shadow:0 0 10px var(--acc);margin-top:4px}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:6px 0 0}
/* boss */
.boss{border:1px solid rgba(216,1,66,.45);border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(135deg,rgba(60,8,30,.55),rgba(14,10,26,.7))}
.boss.done{box-shadow:0 0 16px rgba(216,1,66,.5),inset 0 0 20px rgba(216,1,66,.2);border-color:var(--acc2)}
.bhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bname{font-size:16px;line-height:1.25}
.btag{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--acc2);margin-bottom:3px}
.bxp{font-family:var(--f-mono);color:var(--acc2);font-size:14px;white-space:nowrap}
.bfoot{display:flex;align-items:center;gap:10px;margin-top:10px}
.bfoot .bar{flex:1;height:8px}
.btn{border:1px solid var(--acc);background:rgba(216,1,66,.12);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--f-sub);font-weight:700;letter-spacing:.06em;box-shadow:0 0 8px rgba(216,1,66,.3)}
.btn.solid{background:var(--acc);color:#fff;box-shadow:0 0 14px rgba(216,1,66,.6)}
.btn.ghost{border-color:rgba(255,255,255,.18);background:transparent;box-shadow:none;color:var(--mut)}
.btn.sm{padding:5px 10px;font-size:13px;min-width:36px}
.btn:disabled{opacity:.4}
/* stats */
.srow{display:grid;grid-template-columns:44px 1fr 40px;gap:10px;align-items:center;margin-bottom:10px}
.srow .k{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em}
.srow .k small{display:block;font-size:9px;color:var(--mut);letter-spacing:0}
.srow .v{font-family:var(--f-mono);font-size:17px;text-align:right}
.srow .bar i{transition:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-family:var(--f-mono);font-size:10px;color:var(--dim);text-align:center}
.cell{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--dim);background:#16132a;border:1px solid rgba(255,255,255,.05)}
.cell.partial{background:rgba(216,1,66,.22);border-color:rgba(216,1,66,.55);color:#f4c4d4}
.cell.full{background:var(--acc);border-color:var(--acc2);color:#fff;box-shadow:0 0 10px rgba(216,1,66,.75)}
.cell.today{outline:2px solid #fff;outline-offset:1px}
.cell.blank{background:transparent;border:0}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{text-align:center;padding:10px 4px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07)}
.kpi b{display:block;font-family:var(--f-mono);font-weight:400;font-size:22px;color:#fff;text-shadow:0 0 10px var(--acc)}
.kpi span{font-size:11px;color:var(--mut)}
.qs{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.qs:last-child{border-bottom:0}
.qs span:last-child{font-family:var(--f-mono);color:#ffb36b}
/* settings */
label.f{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;letter-spacing:.06em}
.inp{width:100%;background:#0f0d1d;border:1px solid rgba(216,1,66,.4);border-radius:8px;padding:9px 10px;color:var(--txt);outline:none;min-width:0}
.inp:focus{border-color:var(--acc2);box-shadow:0 0 8px rgba(216,1,66,.5)}

function lvlOf(xp){var L=1;for(var i=1;i<LV_T.length;i++)if(xp>=LV_T[i])L=i+1;return L;}
function decayLoss(d){return d<=3?0:0.8*Math.pow(d-3,1.7);} // slow at first, then faster; no floor above baseline
function curXP(s,day){if(!s.last)return s.xp;return Math.max(0,s.xp-decayLoss(daysBetween(s.last,day)));}
function practiceOn(x,sk,base,day){var s=x.skills[sk];if(!s)return 0;var c=curXP(s,day),add=base;
  if(c<s.peak){var room=s.peak-c;add=2*base<=room?2*base:room+(base-room/2);} // 2x below peak
  add=Math.round(add);s.xp=c+add;s.peak=Math.max(s.peak,s.xp);s.last=day;return add;}
function practice(sk,base,label){var s=S.x.skills[sk];if(!s)return 0;var before=lvlOf(curXP(s,dayKey())),g=practiceOn(S.x,sk,base,dayKey()),after=lvlOf(s.xp);

function unpractice(sk,g){var s=S.x.skills[sk];if(!s||!g)return;s.xp=Math.max(0,s.xp-g);s.peak=Math.max(s.xp,s.peak-g);}

function pad(n){return (n<10?'0':'')+n;}
var fmtCache={};
function fmt(tz,o){var k=tz+JSON.stringify(o);return fmtCache[k]||(fmtCache[k]=new Intl.DateTimeFormat('en-CA',Object.assign({timeZone:tz},o)));}
// BC stays on UTC-7 all year from Nov 1 2026. Older tz databases still fall back to UTC-8,
// so if Intl reports GMT-8 after that date we pin to a fixed UTC-7 zone.
var BC_PERMANENT=Date.UTC(2026,10,1,9);
function zoneFor(d){
  var tz='America/Vancouver';
  if(d.getTime()>=BC_PERMANENT){
    try{var p=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(d);
      for(var i=0;i<p.length;i++)if(p[i].type==='timeZoneName'&&/GMT-8/.test(p[i].value))return 'Etc/GMT+7';}catch(e){}
  }
  return tz;
}
function vParts(d){var o={};fmt(zoneFor(d),{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(function(x){o[x.type]=x.value;});
  return {y:+o.year,m:+o.month,d:+o.day,h:(+o.hour)%24,mi:+o.minute,s:+o.second};}

function addDays(dk,n){var t=toUTC(dk);t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function weekKey(dk){var dow=toUTC(dk).getUTCDay();return addDays(dk,-((dow+6)%7));}
function msToMidnight(){var p=vParts(now());return (86400-(p.h*3600+p.mi*60+p.s))*1000;}

  s.bosses.forEach(function(b){if(b&&b.id)o.bosses.push({id:String(b.id),name:String(b.name||'Boss'),xp:Math.max(0,+b.xp||0),stat:STATS.indexOf(b.stat)>=0?b.stat:'STR',target:Math.max(1,Math.round(+b.target||1))});});

/* ---------- derived ---------- */
function isCore(id){return id.slice(0,3)==='bp-';}
function coreIds(){return chapterIds(S.chapter.idx);}
function dayInfo(dk){
  var e=S.days[dk], today=dk===dayKey();
  if(today||(e&&e.core!=null)){
    var tot=today?coreIds().length:e.core, cur=today?coreIds():null;
    var ids2=e?Object.keys(e.done||{}).filter(function(i){return isCore(i)&&(!cur||cur.indexOf(i)>=0);}):[];
    var side=e?Object.keys(e.done||{}).filter(function(i){return !isCore(i);}).length:0;
    var st2=ids2.length===0?(side?'partial':'none'):(ids2.length>=tot?'full':'partial');
    return {done:ids2.length,total:tot,side:side,status:st2};
  }
  var total=today?S.quests.length:(e?e.total:0);
  if(!e)return {done:0,total:total,status:'none'};
  var ids=Object.keys(e.done||{});
  if(today){var cur={};S.quests.forEach(function(q){cur[q.id]=1;});ids=ids.filter(function(i){return cur[i];});}
  var st=ids.length===0?'none':(total>0&&ids.length>=total?'full':'partial');
  return {done:ids.length,total:total,status:st};
}
function totals(){
  var xp=0,st={},count=0,bosses=0;STATS.forEach(function(k){st[k]=0;});
  Object.keys(S.days).forEach(function(dk){var e=S.days[dk];Object.keys(e.done).forEach(function(id){var c=e.done[id];xp+=+c.xp||0;if(st[c.stat]!=null)st[c.stat]+=DAILY_STAT;count++;});
    if(dayInfo(dk).status==='full')xp+=ALL_CLEAR_BONUS;});
  Object.keys(S.weeks).forEach(function(wk){var e=S.weeks[wk];Object.keys(e.done||{}).forEach(function(id){var c=e.done[id];xp+=+c.xp||0;if(st[c.stat]!=null)st[c.stat]+=BOSS_STAT;bosses++;});});
  X_totals(function(a,k,n){xp+=a;if(k&&st[k]!=null)st[k]+=n||0;});
  return {xp:xp,st:st,count:count,bosses:bosses};

function need(L){return 100+(L-1)*25;}
function levelFrom(xp){var L=1,r=xp;while(r>=need(L)){r-=need(L);L++;}return {L:L,into:r,need:need(L)};}

  var h='<div class="rank"><div class="hex"></div><div class="hex2"></div><b>'+rk.r+'</b><small>RANK</small></div>'+
  '<div><div class="pname"><span class="n">'+esc(S.name)+'</span><span class="lv">LV <b id="lvl">'+lv.L+'</b></span></div>'+
  '<div class="ptag"><span>'+rk.t.toUpperCase()+'</span><span class="streak" id="streak">'+(sk?'&#9650; '+sk+'-day streak':'No streak yet')+'</span></div>'+
  '<div class="bar"><i id="xpbar" style="width:'+(lv.into/lv.need*100).toFixed(1)+'%"></i></div>'+
  '<div class="xpnum"><span id="xp">'+lv.into+' / '+lv.need+' XP</span><span>'+t.xp.toLocaleString()+' total</span></div></div>'+
  '<div class="minis">'+STATS.map(function(k){return '<div class="mini"><span style="color:var(--'+k+')">'+k+'</span><b data-stat="'+k+'">'+(STAT_BASE+t.st[k])+'</b></div>';}).join('')+'</div>';
  h+=renderSkillMini(true);$('#player').innerHTML=h;
  var dk=dayKey();$('#today').innerHTML=esc(niceDay(dk))+'<br><span id="reset">resets in '+dur(msToMidnight())+'</span>';
}
function questBtn(q,e){var d=!!e.done[q.id],sk=questStreak(q.id);
    return '<button class="quest'+(d?' done':'')+'" data-q="'+esc(q.id)+'" aria-pressed="'+d+'"><span class="chk"></span><span class="qbody"><div class="qname">'+esc(qLabel(q))+'</div>'+
    '<div class="qsub">'+chip(q.stat)+(sk?'<span class="fire">&#9650; '+sk+'d</span>':'')+'</div></span><span class="qxp">+'+q.xp+' XP<small>'+q.stat+' +'+DAILY_STAT+'</small></span></button>';}
function renderChapter(){
  var i=S.chapter.idx,c=CHAPTERS[i],r=readiness(),last=i>=CHAPTERS.length-1;
  var h='<section class="panel chapter" id="chapter"><div class="ptitle"><h2>CHAPTER '+(i+1)+'</h2><span class="meta">'+(i+1)+' / '+CHAPTERS.length+'</span></div>'+
    '<div class="cname">'+esc(c.n)+'</div><p class="cwhy">'+esc(c.why)+'</p>';
  if(!last){var nx=CHAPTERS[i+1];
    h+='<div class="pips" aria-label="'+r.got+' of '+r.need+' good days">';for(var k=0;k<r.need;k++)h+='<i class="'+(k<r.got?'on':'')+'"></i>';
    h+='</div><p class="cnext"><b>'+r.got+'/'+r.need+'</b> good days ('+Math.round(GOOD_PCT*100)+'%+ of chapter habits) in the last '+r.window+' days.'+
      (S.chapter.hold?' <span class="hold">Holding here — change in Settings.</span>':'')+' Also needs the chapter <b>final boss</b>: '+(S.x.finals[i]?'beaten &#10003;':'<span class="fire" data-tabgo="boss">'+esc(FINALS[i])+' &rarr;</span>')+'. Unlocks at midnight once both are done.'+'</p>'+
      '<p class="cnext"><span class="mut">NEXT:</span> '+esc(nx.n)+' — '+esc(nx.why)+'</p>';}
  else h+='<p class="cnext">Final chapter: this is close to the full Blueprint day. Keep the rhythm; there is nothing to lose.</p>';
  return h+'</section>';
}
function renderQuests(){
  var dk=dayKey(),e=S.days[dk]||{done:{}},info=dayInfo(dk);
  var h=renderLogCard()+renderChapter()+'<section class="panel"><div class="ptitle"><h2>TODAY\'S HABITS</h2><span class="meta" id="qcount">'+info.done+' / '+info.total+' DONE</span></div>';
  coreIds().forEach(function(id){h+=questBtn(habit(id),e);});
  if(info.status==='full')h+='<div class="clear">CHAPTER DAY CLEAR · +'+ALL_CLEAR_BONUS+' BONUS XP</div>';
  else h+='<p class="hint">Finish all '+info.total+' for +'+ALL_CLEAR_BONUS+' bonus XP. Missed days never cost XP.</p>';
  h+='</section><section class="panel"><div class="ptitle"><h2>SIDE QUESTS</h2><span class="meta">optional</span></div>';
  if(!S.quests.length)h+='<p class="hint">No side quests. Add some in Settings.</p>';
  S.quests.forEach(function(q){h+=questBtn(q,e);});
  return h+'</section>';
}
function renderBoss(){
  var wk=weekKey(dayKey()),e=S.weeks[wk]||{done:{},prog:{}};
  var daysLeft=7-((toUTC(dayKey()).getUTCDay()+6)%7);
  var h='<section class="panel"><div class="ptitle"><h2>WEEKLY BOSSES</h2><span class="meta">'+daysLeft+' DAY'+(daysLeft>1?'S':'')+' LEFT</span></div>';
  if(!S.bosses.length)h+='<p class="hint">No boss goals. Add some in Settings.</p>';
  S.bosses.forEach(function(b){var p=e.prog[b.id]||0,d=!!e.done[b.id];if(d)p=Math.max(p,b.target);
    h+='<div class="boss'+(d?' done':'')+'" data-b="'+esc(b.id)+'"><div class="bhead"><div><div class="btag">'+(d?'DEFEATED':'BOSS · '+b.stat)+'</div><div class="bname">'+esc(b.name)+'</div></div><div class="bxp">+'+b.xp+' XP</div></div>'+
    '<div class="bfoot"><div class="bar"><i style="width:'+(p/b.target*100)+'%"></i></div><span class="ptitle meta" style="margin:0">'+p+'/'+b.target+'</span>'+
    (b.target>1?'<button class="btn sm ghost" data-bstep="-1" '+(p<=0?'disabled':'')+'>&minus;</button><button class="btn sm'+(d?' ghost':' solid')+'" data-bstep="1" '+(d?'disabled':'')+'>+1</button>'
      :'<button class="btn sm'+(d?' ghost':' solid')+'" data-bstep="'+(d?-1:1)+'">'+(d?'Undo':'Defeat')+'</button>')+'</div></div>';});
  h+='<p class="hint">Bosses reset every Monday at midnight (Vancouver). Each is worth +'+BOSS_STAT+' to its stat.</p>';
  return h+'</section>';
}
function renderStats(){
  var t=totals(),max=0;STATS.forEach(function(k){max=Math.max(max,STAT_BASE+t.st[k]);});max=Math.max(max,20);
  var h='<section class="panel"><div class="ptitle"><h2>STATS</h2><span class="meta">base '+STAT_BASE+'</span></div>';
  STATS.forEach(function(k){var v=STAT_BASE+t.st[k];h+='<div class="srow"><div class="k" style="color:var(--'+k+')">'+k+'<small>'+STAT_NAME[k]+'</small></div><div class="bar"><i style="width:'+(v/max*100).toFixed(1)+'%;background:var(--'+k+');box-shadow:0 0 10px var(--'+k+')"></i></div><div class="v">'+v+'</div></div>';});
  h+=renderSkillMini()+'</section>';
  // calendar
  var td=dayKey(),start=addDays(td,-29),lead=(toUTC(start).getUTCDay()+6)%7;
  h+='<section class="panel"><div class="ptitle"><h2>LAST 30 DAYS</h2><span class="meta">'+niceDay(start).replace(/^\w+, /,'')+' – today</span></div><div class="cal" id="cal">';
  ['M','T','W','T','F','S','S'].forEach(function(w){h+='<div class="wd">'+w+'</div>';});
  for(var i=0;i<lead;i++)h+='<div class="cell blank"></div>';
  var full=0,part=0;
  for(var j=0;j<30;j++){var dk=addDays(start,j),inf=dayInfo(dk);if(inf.status==='full')full++;if(inf.status==='partial')part++;
    h+='<div class="cell '+inf.status+(dk===td?' today':'')+'" data-day="'+dk+'" title="'+dk+': '+inf.done+'/'+inf.total+'">'+(+dk.slice(8))+'</div>';}
  h+='</div><div class="legend"><span><i style="background:var(--acc);box-shadow:0 0 6px var(--acc)"></i>All done ('+full+')</span><span><i style="background:rgba(216,1,66,.3);border:1px solid var(--acc)"></i>Partial ('+part+')</span><span><i style="background:#16132a;border:1px solid #333"></i>Rest</span></div></section>';
  h+='<section class="panel"><div class="kpis"><div class="kpi"><b id="kStreak">'+overallStreak()+'</b><span>Current streak</span></div><div class="kpi"><b>'+bestStreak()+'</b><span>Best streak</span></div><div class="kpi"><b>'+t.count+'</b><span>Quests done</span></div></div></section>';
  h+='<section class="panel"><div class="ptitle"><h2>QUEST STREAKS</h2><span class="meta">days in a row</span></div>';
  coreIds().map(habit).concat(S.quests).forEach(function(q){h+='<div class="qs"><span>'+esc(qLabel(q))+'</span><span>'+questStreak(q.id)+'</span></div>';});
  return h+'<p class="hint">Rest days are fine. Streaks restart, XP never goes down.</p></section>';
}
function statSel(v){return '<select class="inp" data-f="stat">'+STATS.map(function(k){return '<option'+(k===v?' selected':'')+'>'+k+'</option>';}).join('')+'</select>';}
function renderSettings(){
  var h='<section class="panel"><div class="ptitle"><h2>PLAYER</h2></div><label class="f" for="pname">Name</label><input class="inp" id="pname" value="'+esc(S.name)+'" maxlength="24"></section>';
  var ci=S.chapter.idx;
  h+='<section class="panel" id="chapterSettings"><div class="ptitle"><h2>BLUEPRINT RAMP</h2><span class="meta">'+(ci+1)+' / '+CHAPTERS.length+'</span></div>'+
    '<p class="note" style="margin:0 0 8px">Now: <b>'+esc(chapterTitle(ci))+'</b>. Next chapter unlocks after '+UNLOCK_NEED+' good days in '+UNLOCK_WINDOW+'.</p>'+
    '<label class="f" for="bedtime">Lights-out time</label><input class="inp" type="time" id="bedtime" value="'+esc(S.bedtime)+'">'+
    '<label class="tog"><input type="checkbox" id="holdChk"'+(S.chapter.hold?' checked':'')+'> Stay in this chapter (pause auto-unlock)</label>'+
    '<div class="row-btns"><button class="btn ghost" id="chBack"'+(ci<=0?' disabled':'')+'>&larr; Go back</button><button class="btn" id="chSkip"'+(ci>=CHAPTERS.length-1?' disabled':'')+'>Skip ahead &rarr;</button></div>'+
    '<p class="note"><b>Health note:</b> Level Up is a habit tracker, not medical advice. The ramp is adapted from Bryan Johnson\'s public Blueprint protocol. Talk to your doctor before changing diet, eating windows or exercise intensity, or taking any supplement. Supplements are never part of the quests.</p></section>';
  h+='<section class="panel"><div class="ptitle"><h2>SIDE QUESTS</h2><span class="meta">'+S.quests.length+'</span></div><div id="qedit">';
  S.quests.forEach(function(q){var hasT=q.time!=null;
    h+='<div class="erow" data-kind="q" data-id="'+esc(q.id)+'"><input class="inp" data-f="name" value="'+esc(q.name)+'" aria-label="Quest name">'+
    '<div class="l2"><div><div class="mini-l">STAT</div>'+statSel(q.stat)+'</div><div><div class="mini-l">XP</div><input class="inp" type="number" min="0" max="999" inputmode="numeric" data-f="xp" value="'+q.xp+'"></div>'+
    '<button class="del" data-del title="Delete">&times;</button></div>'+
    (hasT?'<div class="tline"><div class="mini-l">BEDTIME</div><input class="inp" type="time" data-f="time" value="'+esc(q.time)+'"></div>':'')+'</div>';});
  h+='</div><div class="row-btns"><button class="btn" id="addQ">+ Add quest</button></div></section>';
  h+='<section class="panel"><div class="ptitle"><h2>WEEKLY BOSSES</h2><span class="meta">'+S.bosses.length+'</span></div>';
  S.bosses.forEach(function(b){
    h+='<div class="erow" data-kind="b" data-id="'+esc(b.id)+'"><input class="inp" data-f="name" value="'+esc(b.name)+'" aria-label="Boss name">'+
    '<div class="l2 b"><div><div class="mini-l">STAT</div>'+statSel(b.stat)+'</div><div><div class="mini-l">XP</div><input class="inp" type="number" min="0" max="9999" inputmode="numeric" data-f="xp" value="'+b.xp+'"></div>'+
    '<div><div class="mini-l">TIMES</div><input class="inp" type="number" min="1" max="99" inputmode="numeric" data-f="target" value="'+b.target+'"></div><button class="del" data-del title="Delete">&times;</button></div></div>';});
  h+='<div class="row-btns"><button class="btn" id="addB">+ Add boss</button></div></section>';
  h+='<section class="panel"><div class="ptitle"><h2>DATA</h2></div><div class="row-btns"><button class="btn solid" id="exportBtn">Export JSON</button><button class="btn" id="importBtn">Import JSON</button></div>'+
  '<p class="note">Everything is saved only on this device. Export a backup now and then — clearing browser data erases progress. Editing XP only changes future completions.</p>'+
  '<div class="row-btns" style="margin-top:10px"><button class="btn ghost" id="resetBtn">Reset all progress</button></div></section>';
  return h;
}
var mqWide=window.matchMedia?matchMedia('(min-width:640px)'):null;
function isWide(){return !!(mqWide&&mqWide.matches);}
function render(){
  renderPlayer();
  var v=$('#view'),w=isWide();
  if(w&&tab==='stats')tab='quests';
  v.innerHTML=tab==='quests'?renderQuests():tab==='boss'?renderLadder():tab==='skills'?renderSkills():tab==='stats'?renderStats():renderSettings();
  $('#sidex').innerHTML=w?renderStats():'';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab);});
}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},1800);}
var lvT;
function showLevelUp(from,to){
  var rk=rankFor(to),newRank=rankFor(from).r!==rk.r;
  var o=$('#levelup');
  o.innerHTML='<div class="ring"></div><div class="ring r2"></div><div class="scan"></div><div class="card"><div class="tag">NEW LEVEL REACHED</div><h1>LEVEL UP!</h1>'+
   '<div class="nums">LV '+from+' &rarr; <b>'+to+'</b></div><div class="rk">'+(newRank?'NEW RANK: '+rk.r+' · '+rk.t.toUpperCase():'RANK '+rk.r+' · '+rk.t.toUpperCase())+'</div><div class="tap">TAP TO CONTINUE</div></div>';
  o.classList.add('show');clearTimeout(lvT);lvT=setTimeout(hideLevelUp,6000);
  if(navigator.vibrate)try{navigator.vibrate([40,40,80]);}catch(e){}
}
function hideLevelUp(){$('#levelup').classList.remove('show');}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;
  if(X_click(t))return;
  var tb=t.closest('.tab');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return;}
  if(t.closest('#levelup')){hideLevelUp();return;}
  var q=t.closest('.quest');if(q){toggleQuest(q.dataset.q);return;}
  var bs=t.closest('[data-bstep]');if(bs){bossStep(bs.closest('.boss').dataset.b,+bs.dataset.bstep);return;}
  if(t.closest('[data-del]')){var r=t.closest('.erow'),list=r.dataset.kind==='q'?S.quests:S.bosses,i=list.findIndex(function(x){return x.id===r.dataset.id;});
    if(i>=0&&confirm('Delete "'+list[i].name+'"?')){var id=list[i].id;list.splice(i,1);
      if(r.dataset.kind==='q'){var e=S.days[dayKey()];if(e){delete e.done[id];e.total=S.quests.length;}}
      else{var w=S.weeks[weekKey(dayKey())];if(w){delete w.done[id];delete w.prog[id];}}
      save();render();}return;}
  if(t.id==='addQ'){S.quests.push({id:'q'+Date.now().toString(36),name:'New quest',xp:20,stat:'STR'});var e2=S.days[dayKey()];if(e2)e2.total=S.quests.length;save();render();focusLast('#qedit');return;}
  if(t.id==='addB'){if(S.bosses.length>=BOSS_CAP){toast('Boss slots full ('+BOSS_CAP+'/'+BOSS_CAP+')');return;}S.bosses.push({id:'b'+Date.now().toString(36),name:'New boss goal',xp:150,stat:'BIZ',target:1});save();render();return;}
  if(t.id==='chSkip'){if(confirm('Skip ahead to '+chapterTitle(S.chapter.idx+1)+'?')){setChapter(S.chapter.idx+1,'skip');save();render();toast('Now: '+CHAPTERS[S.chapter.idx].n);}return;}
  if(t.id==='chBack'){if(confirm('Go back to '+chapterTitle(S.chapter.idx-1)+'? No XP is lost.')){setChapter(S.chapter.idx-1,'back');save();render();toast('Now: '+CHAPTERS[S.chapter.idx].n);}return;}
  if(t.id==='exportBtn'){exportData();return;}
  if(t.id==='importBtn'){$('#importFile').value='';$('#importFile').click();return;}
  if(t.id==='resetBtn'){if(confirm('Erase ALL progress and quests? Export first if unsure.')){S=defaults();save();render();toast('Reset done');}return;}
});
function focusLast(sel){var rows=document.querySelectorAll(sel+' .erow');var r=rows[rows.length-1];if(r){r.scrollIntoView({block:'center'});var i=r.querySelector('[data-f=name]');i.focus();i.select();}}
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='pname'){S.name=t.value.trim()||'Phillip';save();renderPlayer();return;}
  if(t.id==='importFile'){importFile(t.files[0]);return;}
  if(t.id==='bedtime'){S.bedtime=t.value||'22:30';save();return;}
  if(t.id==='holdChk'){S.chapter.hold=t.checked;save();toast(t.checked?'Holding this chapter':'Auto-unlock on');return;}
  var r=t.closest('.erow');if(!r||!t.dataset.f)return;
  var list=r.dataset.kind==='q'?S.quests:S.bosses,item=list.find(function(x){return x.id===r.dataset.id;});if(!item)return;
  var f=t.dataset.f,v=t.value;
  if(f==='xp')v=Math.max(0,Math.round(+v||0));
  if(f==='target')v=Math.max(1,Math.round(+v||1));
  if(f==='name')v=v.trim()||item.name;
  if(f==='time'&&!v)v='22:30';
  item[f]=v;t.value=v;save();renderPlayer();
});

/* ---------- export / import ---------- */
function exportData(){
  var data=Object.assign({app:'aw-level-up',exportedAt:new Date().toISOString()},S);
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='level-up-backup-'+dayKey()+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup exported');
}
function importFile(file){
  if(!file)return;var rd=new FileReader();
  rd.onload=function(){var d;try{d=JSON.parse(rd.result);}catch(e){toast('Not a valid JSON file');return;}
    if(!valid(d)){toast('That file is not a Level Up backup');return;}
    if(!confirm('Replace current progress with this backup?'))return;
    S=clean(d);S.maxLevel=Math.max(S.maxLevel,levelFrom(totals().xp).L);save();render();toast('Backup imported');};
  rd.readAsText(file);
}

/* ---------- clock, rollover ---------- */
function tick(){var dk=dayKey();if(dk!==lastDK){lastDK=dk;var up=advanceIfReady();render();if(up)toast('UNLOCKED: '+chapterTitle(S.chapter.idx));}else{var r=$('#reset');if(r)r.textContent='resets in '+dur(msToMidnight());}}
setInterval(tick,15000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});

/* ---------- debug / test hook ---------- */
window.__levelUp={
  setNow:function(d){override=d==null?null:new Date(d).getTime();tick();lastDK=dayKey();render();return dayKey();},
  chapter:function(){var r=readiness();return {idx:S.chapter.idx,name:CHAPTERS[S.chapter.idx].n,start:S.chapter.start,hold:S.chapter.hold,got:r.got,ids:coreIds(),count:CHAPTERS.length};},
  wide:function(){return isWide();},
  dayKey:function(){return dayKey();}, weekKey:function(){return weekKey(dayKey());},
  state:function(){return clone(S);},
  load:function(s){if(!valid(s))throw new Error('invalid');S=clean(s);S.maxLevel=Math.max(S.maxLevel,levelFrom(totals().xp).L);save();render();},
  summary:function(){var t=totals(),lv=levelFrom(t.xp);var d=dayInfo(dayKey());return {xp:t.xp,stats:Object.keys(t.st).reduce(function(o,k){o[k]=STAT_BASE+t.st[k];return o;},{}),level:lv.L,rank:rankFor(lv.L).r,streak:overallStreak(),best:bestStreak(),today:d,day:dayKey()};},
  questStreak:questStreak,skills:function(){return SKILLS.map(function(k){return Object.assign({id:k.id},skillView(k.id));});},x:function(){return clone(S.x);}, need:need, tab:function(n){tab=n;render();}
};

S.maxLevel=Math.max(S.maxLevel,levelFrom(totals().xp).L);
advanceIfReady();
render();
if(mqWide){var onMq=function(){render();};if(mqWide.addEventListener)mqWide.addEventListener('change',onMq);else if(mqWide.addListener)mqWide.addListener(onMq);}
/* Preview: no service worker, so it can never touch the live app's caches on the same origin. */
})();

</script>
</body>
